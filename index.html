<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Senga xat bor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Playfair+Display:ital,wght@1,600&family=Caveat:wght@700&family=Lobster&family=Abril+Fatface&family=Yellowtail&family=Great+Vibes&family=Kalam:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{margin:0;min-height:100vh;color:#f5e6d8;font-family:Georgia,serif;background:radial-gradient(ellipse at 50% 38%,#4a2819,#24120b 55%,#120805 100%);overflow:hidden;transition:background 1.4s ease}
body.letter-opened{background:radial-gradient(ellipse at 50% 42%,#3d2015,#1e0f0a 60%,#0e0604 100%)}
canvas#bg{position:fixed;inset:0;z-index:0}
canvas#trail{position:fixed;inset:0;z-index:50;pointer-events:none}

/* "Ha" dan keyingi fon */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.8s ease;background:radial-gradient(ellipse at 50% 40%,#3a1f5c 0%,#1a0f33 55%,#090516 100%)}
body.yes-mode::before{opacity:1}
body.yes-mode .chip{background:rgba(130,100,210,.28);border-color:rgba(225,210,255,.32)}
body.yes-mode .chip.on{background:#ff5c8a;border-color:#ff5c8a}
body.yes-mode input[type="time"]{background:rgba(130,100,210,.3);border-color:rgba(225,210,255,.32)}

/* 702 kirish animatsiyasi */
#preloader-702{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#381d12 0%,#1d0e08 62%,#0d0603 100%);transition:opacity .85s cubic-bezier(.4,0,.2,1),visibility .85s ease}
#preloader-702.fade-out{opacity:0;visibility:hidden;pointer-events:none}
.num-702{position:relative;font-size:clamp(4.5rem,18vw,11rem);font-family:'Abril Fatface',serif;font-weight:400;letter-spacing:.08em;line-height:1;background:linear-gradient(120deg,#c68b59 0%,#ffe6b8 45%,#dca06d 70%,#fff2d6 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:scale(.78) translateY(18px);filter:drop-shadow(0 0 28px rgba(220,160,109,.3));animation:appear702 1.25s cubic-bezier(.16,1,.3,1) .15s forwards,shimmer702 2.4s linear .4s infinite}
.line-702{width:0;height:1.5px;margin-top:18px;background:linear-gradient(90deg,transparent,#e8b482,transparent);animation:expandLine702 1.1s cubic-bezier(.22,1,.36,1) .55s forwards}
@keyframes appear702{0%{opacity:0;transform:scale(.78) translateY(18px)}100%{opacity:1;transform:scale(1) translateY(0);filter:drop-shadow(0 0 35px rgba(232,180,130,.45))}}
@keyframes shimmer702{0%{background-position:0% center}100%{background-position:200% center}}
@keyframes expandLine702{0%{width:0;opacity:0}100%{width:min(260px,55vw);opacity:.9}}

/* Maxsus kursor */
@media (hover:hover){
  body,button{cursor:none}
  .dot,.ring{position:fixed;left:0;top:0;z-index:100;pointer-events:none;border-radius:50%;will-change:transform}
  .dot{width:8px;height:8px;background:#e8b482;margin:-4px 0 0 -4px}
  .ring{width:44px;height:44px;border:1.5px solid rgba(232,180,130,.72);margin:-22px 0 0 -22px;transition:width .25s,height .25s,margin .25s,background .25s}
  .ring.big{width:84px;height:84px;margin:-42px 0 0 -42px;background:rgba(255,110,150,.18)}
}
@media (hover:none){.dot,.ring{display:none}}
.video-frame,.video-frame video{cursor:auto!important}

main{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.hidden{display:none!important}

/* 1-ekran */
.intro{text-align:center}
.title{margin:0 0 10px;font-family:'Luckiest Guy',cursive;font-size:clamp(3.2rem,12vw,8.2rem);line-height:1.05;letter-spacing:.04em;font-weight:400;color:#d69867;text-shadow:0 2px 0 rgba(56,26,14,.9),0 10px 28px rgba(0,0,0,.65)}
.title span{display:inline-block;opacity:0;transform:translateY(60%) rotate(8deg)}
.title.play-anim span{animation:rise 1s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.sub{margin:0 0 36px;opacity:.9;font-family:'Caveat',cursive;font-size:1.9rem;color:#3b2a1b}
.envelope{transition:box-shadow .3s;position:relative;width:280px;height:190px;border:0;border-radius:8px;background:#3f1320;padding:0;transform:translate(var(--mx,0px),var(--my,0px));box-shadow:0 0 40px rgba(255,92,138,.35);overflow:visible}
.envelope:hover{box-shadow:0 0 70px rgba(87,15,35,.866)}
.envelope::before{content:"";position:absolute;inset:0;border-radius:8px;background:#9b2347;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);z-index:2}
.flap{position:absolute;left:0;right:0;top:0;height:60%;background:#3e1421;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .55s cubic-bezier(.34,1.56,.64,1);z-index:3}
.seal{position:absolute;left:50%;top:50%;font-size:2.2rem;transform:translate(-50%,-50%);transition:opacity .25s,transform .25s;z-index:4}
.tear-seam{position:absolute;left:50%;top:0;width:4px;height:0;transform:translateX(-50%);background:linear-gradient(180deg,#fff5e6,#e8b482,rgba(232,180,130,0));box-shadow:0 0 14px #e8b482;z-index:6;opacity:0;pointer-events:none}
.envelope.tearing .tear-seam{opacity:1;animation:tearLineAnim .42s cubic-bezier(.22,1,.36,1) forwards}
@keyframes tearLineAnim{0%{height:0;opacity:1}75%{height:100%;opacity:1}100%{height:100%;opacity:0}}
.envelope.tearing .flap{transform:rotateX(180deg)}
.envelope.tearing .seal{opacity:0;transform:translate(-50%,-50%) scale(1.6) rotate(25deg)}
.envelope.tearing{animation:ripShake .38s ease forwards}
@keyframes ripShake{
0%{transform:translate(var(--mx,0px),var(--my,0px)) rotate(0)}
25%{transform:translate(calc(var(--mx,0px) - 5px),var(--my,0px)) rotate(-2.2deg)}
50%{transform:translate(calc(var(--mx,0px) + 5px),var(--my,0px)) rotate(2.2deg)}
75%{transform:translate(calc(var(--mx,0px) - 3px),var(--my,0px)) rotate(-1deg)}
100%{transform:translate(var(--mx,0px),var(--my,0px)) scale(1.06);opacity:0}}

/* 2-ekran: video xat */
.letter{max-width:540px;width:100%;padding:32px 28px;background:#fff;color:#2b1710;border:1px solid rgba(214,152,103,.45);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 45px rgba(255,255,255,.16);transform-origin:center}
.letter:not(.hidden){animation:letterUnfold .78s cubic-bezier(.19,1,.22,1) forwards}
@keyframes letterUnfold{
0%{opacity:0;transform:scale(.72) translateY(36px) rotateX(18deg);clip-path:inset(38% 12% 38% 12% round 18px)}
55%{opacity:1;clip-path:inset(6% 2% 6% 2% round 18px)}
100%{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 18px)}}
.letter h2{margin:0 0 16px;font-family:'Luckiest Guy',cursive;font-size:2.2rem;letter-spacing:.03em;font-weight:400;color:#8f4e2b;text-align:center}
.video-frame{position:relative;width:min(100%,300px);aspect-ratio:9/16;max-height:56vh;margin:0 auto;border-radius:14px;overflow:hidden;background:#140a06;box-shadow:0 12px 30px rgba(43,23,16,.22);border:2px solid rgba(214,152,103,.45)}
.video-frame video{width:100%;height:100%;display:block;object-fit:contain}
button.next{display:block;margin:22px auto 0;padding:13px 32px;border:0;border-radius:999px;background:#69172e;color:#fff;font-size:1rem;box-shadow:0 8px 24px rgba(77,12,12,.94)}

/* Savol ekrani */
.ask{text-align:center;max-width:640px}
.q{margin:0 0 36px;font-size:clamp(2rem,7vw,4rem);line-height:1.1;font-weight:400;color:#f8e8d8;text-shadow:0 6px 24px rgba(0,0,0,.45)}
#ask .q{font-family:'Playfair Display',serif;font-style:italic;font-weight:600}
.step[data-step="1"] .q{font-family:'Pacifico',cursive;font-size:clamp(1.8rem,6vw,3.2rem);line-height:1.35}
.step[data-step="2"] .q{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(3.2rem,11vw,6rem)}
.step[data-step="3"] .q{font-family:'Lobster',cursive;font-size:clamp(2rem,7vw,3.6rem)}
.step[data-step="4"] .q{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(3.2rem,11vw,6rem);background:linear-gradient(120deg,#f2c48d,#fff0d4,#d69867);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 18px rgba(0,0,0,.45));animation:glowIn 1s cubic-bezier(.2,.9,.2,1) backwards,bob 4s ease-in-out 1s infinite}
.answers{display:flex;gap:20px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:110px}
.yes,.no{border:0;border-radius:999px;padding:14px 32px;font-size:1.1rem;color:#fff}
.yes{background:#340814;box-shadow:0 0 30px rgba(118,2,34,.875);transition:transform .35s cubic-bezier(.2,.9,.2,1)}
.no{background:rgba(255,240,225,.14);border:1px solid rgba(255,240,225,.28)}
.no.fly{position:fixed;z-index:60;transition:left .35s cubic-bezier(.2,.9,.2,1),top .35s cubic-bezier(.2,.9,.2,1)}
.hint{min-height:1.5em;margin:16px 0 0;opacity:.85;color:#bebebe;font-family:'Kalam',cursive;font-size:1.05rem}

/* Bosqichli savollar */
.step{display:none}
.step.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{padding:12px 22px;border-radius:999px;border:1px solid rgba(255,235,215,.25);background:rgba(66,36,24,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:1.05rem;transition:background .25s,transform .25s}
.chip:hover{background:rgba(255,92,138,.38);transform:translateY(-3px)}
.chip.on{background:#ff5c8a;border-color:#ff5c8a}
input[type="time"]{display:block;margin:24px auto 0;padding:10px 18px;border-radius:999px;border:1px solid rgba(255,235,215,.28);background:rgba(66,36,24,.5);color:#fff;font-size:1.1rem;font-family:inherit}
.main{display:block;margin:24px auto 0;padding:14px 34px;border:0;border-radius:999px;background:#ff5c8a;color:#fff;font-size:1.1rem;box-shadow:0 0 30px rgba(255,92,138,.5)}
.main.locked{opacity:.45;box-shadow:none}
.shake{animation:shake .45s!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}


button,.chip,input[type="time"]{font-family:'Fredoka',sans-serif;letter-spacing:.02em}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
canvas#bg{transition:opacity 1.4s ease}
body.final-mode canvas#bg{opacity:0}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.6s ease;background:radial-gradient(rgba(255,235,210,.09) 1.4px,transparent 1.8px) 0 0/26px 26px,radial-gradient(ellipse at 50% 30%,#7a4e2e 0%,#4a2a17 52%,#241109 100%)}
body.final-mode::after{opacity:1}
body.final-mode .main{background:linear-gradient(135deg,#d69867,#9c6137);box-shadow:0 0 30px rgba(214,152,103,.45)}
#floaters{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 1.8s ease}
body.final-mode #floaters{opacity:1}
.fl{position:absolute;bottom:-60px;opacity:.35;animation:floatUp linear infinite}
@keyframes floatUp{to{transform:translateY(-115vh) rotate(40deg)}}

/* ===== Kirish / chiqish animatsiyalari ===== */
.q .w{display:inline-block}
.intro.leaving .title span{animation:letterOut .75s cubic-bezier(.5,0,.9,.4) forwards!important;animation-delay:calc(var(--i)*.05s)!important}
@keyframes letterOut{from{opacity:1;transform:none}to{opacity:0;transform:translate(var(--ox),var(--oy)) rotate(var(--or)) scale(.3)}}
.intro.leaving .sub{animation:subOut .5s ease forwards}
@keyframes subOut{to{opacity:0;transform:translateY(20px);letter-spacing:.3em}}
.letter.leaving{animation:letterFold .75s cubic-bezier(.6,0,.9,.4) forwards}
@keyframes letterFold{to{opacity:0;transform:translateY(-90px) scale(.55) rotate(-7deg);clip-path:inset(42% 8% 42% 8% round 18px)}}

#ask .w{animation:wordDrop .8s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(var(--i)*.13s + .1s)}
@keyframes wordDrop{from{opacity:0;transform:translateY(-70px) rotateX(-80deg);filter:blur(10px)}}
#ask .yes{animation:popElastic .8s cubic-bezier(.2,1.7,.4,1) 1s backwards}
@keyframes popElastic{from{opacity:0;transform:scale(0)}}
#ask .no{animation:slideUpFade .7s ease 1.2s backwards}
@keyframes slideUpFade{from{opacity:0;transform:translateY(40px)}}
#ask.leaving .w{animation:wordBurst .7s cubic-bezier(.5,0,.9,.4) forwards;animation-delay:calc(var(--i)*.05s)}
@keyframes wordBurst{to{opacity:0;transform:translateY(-50px) scale(1.7);filter:blur(12px)}}
#ask.leaving .yes{animation:zoomOutBig .7s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes zoomOutBig{to{opacity:0;transform:scale(3.2)}}
#ask.leaving .no{animation:shrinkAway .5s ease forwards}
@keyframes shrinkAway{to{opacity:0;transform:scale(0) rotate(90deg)}}

/* 1: Qayerga? */
.step[data-step="1"] .q .w{animation:stampIn .7s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--i)*.1s + .1s)}
@keyframes stampIn{from{opacity:0;transform:scale(3) rotate(-10deg);filter:blur(10px)}}
.step[data-step="1"] .chip{animation:cascadeUp .6s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(var(--i)*.09s + .6s)}
@keyframes cascadeUp{from{opacity:0;transform:translateY(70px) scale(.6) rotate(8deg)}}
.step[data-step="1"].leaving .q .w{animation:spinOut .6s cubic-bezier(.5,0,.9,.4) forwards;animation-delay:calc(var(--i)*.05s)}
@keyframes spinOut{to{opacity:0;transform:rotate(540deg) scale(0)}}
.step[data-step="1"].leaving .chip{animation:dropOut .5s cubic-bezier(.5,0,.9,.4) forwards;animation-delay:calc(var(--i)*.06s)}
@keyframes dropOut{to{opacity:0;transform:translateY(170px) rotate(25deg) scale(.7)}}

/* 2: Qachon? */
.step[data-step="2"] .q .w{animation:slideInLeft .8s cubic-bezier(.2,1.2,.4,1) backwards;animation-delay:.1s}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-140px) skewX(25deg)}}
.step[data-step="2"] .chip{animation:flipIn .6s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(var(--i)*.1s + .45s)}
@keyframes flipIn{from{opacity:0;transform:perspective(500px) rotateX(-90deg)}}
.step[data-step="2"] #time,.step[data-step="2"] #whenNext,.step[data-step="2"] #whenMsg{animation:slideUpFade .6s ease 1s backwards}
.step[data-step="2"].leaving .q .w{animation:slideOutRight .6s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes slideOutRight{to{opacity:0;transform:translateX(170px) skewX(-25deg)}}
.step[data-step="2"].leaving .chip{animation:flipOut .5s ease forwards;animation-delay:calc(var(--i)*.07s)}
@keyframes flipOut{to{opacity:0;transform:perspective(500px) rotateX(90deg)}}
.step[data-step="2"].leaving #time,.step[data-step="2"].leaving #whenNext,.step[data-step="2"].leaving #whenMsg{animation:fadeDown .5s ease forwards}
@keyframes fadeDown{to{opacity:0;transform:translateY(40px)}}

/* 3: Gul */
.step[data-step="3"] .q .w{animation:blurRise .9s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(var(--i)*.12s + .1s)}
@keyframes blurRise{from{opacity:0;transform:translateY(40px) scale(.8);filter:blur(12px);letter-spacing:.4em}}
.step[data-step="3"] .chip{animation:bloom .7s cubic-bezier(.2,1.6,.4,1) backwards;animation-delay:calc(var(--i)*.12s + .6s)}
@keyframes bloom{from{opacity:0;transform:scale(0) rotate(-120deg)}}
.step[data-step="3"].leaving .q .w{animation:shrinkOut .6s ease forwards;animation-delay:calc(var(--i)*.06s)}
@keyframes shrinkOut{to{opacity:0;transform:scale(.2);filter:blur(8px)}}
.step[data-step="3"].leaving .chip{animation:wither .6s ease forwards;animation-delay:calc(var(--i)*.07s)}
@keyframes wither{to{opacity:0;transform:translateY(120px) rotate(60deg) scale(.5);filter:grayscale(1) brightness(.6)}}

/* tanlangan chip chiqishi */
.step[data-step].leaving .chip.on{animation:chosenOut .6s ease .15s forwards}
@keyframes chosenOut{0%{transform:scale(1.15)}40%{transform:scale(1.3)}100%{opacity:0;transform:scale(2)}}

/* 4: Hammasi tayyor */
@keyframes glowIn{from{opacity:0;transform:scale(.5);filter:blur(14px)}}
.step[data-step="4"] .main{animation:riseIn .8s cubic-bezier(.2,.9,.2,1) .8s backwards}
@keyframes riseIn{from{opacity:0;transform:translateY(40px) scale(.8)}}
.step[data-step="4"].leaving .q{animation:floatAway .8s ease forwards}
@keyframes floatAway{to{opacity:0;transform:translateY(-110px) scale(1.15);filter:blur(12px)}}
.step[data-step="4"].leaving .main{animation:sinkOut .6s ease forwards}
@keyframes sinkOut{to{opacity:0;transform:translateY(60px) scale(.8)}}

/* ===== Rahmat ekrani ===== */
#thanksBg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;clip-path:circle(0% at 50% 62%);transition:clip-path 1.8s cubic-bezier(.65,0,.25,1);background:radial-gradient(circle at 50% 105%,#ffe3a8 0%,#f7a76b 24%,#c95f86 55%,#4c1f52 100%)}
#thanksBg.show{clip-path:circle(150% at 50% 62%)}
.bk{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,244,214,.85),rgba(255,244,214,0) 70%);animation:bokeh ease-in-out infinite alternate}
@keyframes bokeh{from{transform:translate(0,0) scale(.8);opacity:.25}to{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:.7}}
.thx{font-family:'Yellowtail',cursive;font-weight:400;font-size:clamp(4rem,16vw,9rem);line-height:1.1;margin:0 0 10px;color:#fff7ea;text-shadow:0 6px 30px rgba(75,29,74,.55)}
.thx span{display:inline-block;animation:letterBounce .9s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i)*.09s + .2s)}
@keyframes letterBounce{from{opacity:0;transform:translateY(-130px) scale(.6) rotate(-12deg)}}
.thx2{font-family:'Caveat',cursive;font-size:clamp(1.8rem,6vw,3rem);color:#fff0d6;text-shadow:0 4px 18px rgba(75,29,74,.5);margin:0}
.thx2 .w{display:inline-block;animation:blurIn .9s ease backwards;animation-delay:calc(var(--i)*.18s + 1.2s)}
@keyframes blurIn{from{opacity:0;transform:translateY(18px);filter:blur(10px)}}
</style>
</head>
<body>
<div id="preloader-702"><div class="num-702">702</div><div class="line-702"></div></div>
<div class="dot" id="dot"></div>
<div class="ring" id="ring"></div>
<canvas id="bg"></canvas>
<canvas id="trail"></canvas>

<div id="thanksBg"></div>

<main id="main-ui">
  <div class="intro" id="intro">
    <h1 class="title" id="title">Salom😁</h1>
    <p class="sub">Senga bitta xat bor…</p>
    <button class="envelope" id="envelope" aria-label="Xatni ochish">
      <span class="tear-seam"></span><span class="flap"></span><span class="seal">💌</span>
    </button>
  </div>

  <article class="letter hidden" id="letter">
    <h2>Qomarii 🫶🏼</h2>
    <div class="video-frame"><video id="letterVideo" controls playsinline preload="metadata"></video></div>
    <button class="next" id="toAsk">Davom etish 💌</button>
  </article>

  <section class="ask hidden" id="ask">
    <h2 class="q">Men bilan uchrashuvga chiqasanmi? </h2>
    <div class="answers">
      <button class="yes" id="yes">Ha, albatta 💖</button>
      <button class="no" id="no">Yo‘q</button>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="ask hidden" id="done">
    <div class="step on" data-step="1">
      <h2 class="q">Ura! Kelishdik 🎉<br>Qayerga boramiz?</h2>
      <div class="chips" data-key="where" data-next="2">
        <button class="chip" data-v="Kafe">☕ Kafe</button>
        <button class="chip" data-v="Park">🌳 Park</button>
        <button class="chip" data-v="Kino">🎬 Kino</button>
        <button class="chip" data-v="Restoran">🍽 Restoran</button>
        <button class="chip" data-v="Sen tanla">✨ Sen tanla</button>
      </div>
    </div>
    <div class="step" data-step="2">
      <h2 class="q">Qachon?</h2>
      <div class="chips" data-key="when">
        <button class="chip" data-v="Bugun">Bugun</button>
        <button class="chip" data-v="Ertaga">Ertaga</button>
        <button class="chip" data-v="Dam olish kuni">Dam olish kuni</button>
      </div>
      <input type="time" id="time" value="" aria-label="Vaqt">
      <button class="main locked" id="whenNext">Davom etish</button>
      <p class="hint" id="whenMsg">Avval kunni, keyin soatni tanla</p>
    </div>
    <div class="step" data-step="3">
      <h2 class="q">Qaysi gulni yoqtirasan?</h2>
      <div class="chips" data-key="flower" data-next="4">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== SOZLAMALAR ===== */
const LETTER_VIDEO_URL = 'xat.mp4';   // fayl nomi aynan shunday bo'lsin
const TELEGRAM = 'ramazon702';
const WEB3FORMS_KEY = '3feace75-1200-4f95-b004-ebbbbd02e996';

const letterVideo = document.getElementById('letterVideo');
letterVideo.src = LETTER_VIDEO_URL;
letterVideo.addEventListener('error', function () {
  const codes = { 1:'yuklash bekor qilindi', 2:'internet xatosi', 3:'format o‘ynalmaydi (kodek)', 4:'fayl topilmadi yoki format mos emas' };

});

/* ===== 0. Kirish animatsiyasi ===== */
const title = document.getElementById('title');
const word = title.textContent;
title.textContent = '';
word.split('').forEach(function (ch, i) {
  const s = document.createElement('span');
  s.textContent = ch;
  s.style.setProperty('--i', i);
  s.style.setProperty('--ox', (Math.random() * 300 - 150) + 'px');
  s.style.setProperty('--oy', (-120 - Math.random() * 220) + 'px');
  s.style.setProperty('--or', (Math.random() * 120 - 60) + 'deg');
  s.style.animationDelay = (0.2 + i * 0.08) + 's';

});
const preloader = document.getElementById('preloader-702');
setTimeout(function () {
  preloader.classList.add('fade-out');

}, 2300);

/* ===== 2. 3D fon ===== */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
camera.position.z = 12;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg'), alpha: true, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const HEART = 9000, DUST = 2500, COUNT = HEART + DUST;
const pos = new Float32Array(COUNT * 3);
const orbitPos = new Float32Array(COUNT * 3);
const helixPos = new Float32Array(COUNT * 3);
const seed = new Float32Array(COUNT);

for (let i = 0; i < HEART; i++) {
  const t = Math.random() * Math.PI * 2;
  const hx = 16 * Math.pow(Math.sin(t), 3);
  const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  const k = Math.sqrt(Math.random());
  pos[i*3] = hx * 0.2 * k;
  pos[i*3+1] = hy * 0.2 * k + 0.3;
  pos[i*3+2] = (Math.random() - 0.5) * 2.2;

  const arm = i % 3;
  const radius = 1.4 + Math.pow(Math.random(), 0.7) * 11.5;
  const angle = radius * 0.65 + (arm * Math.PI * 2) / 3 + (Math.random() - 0.5) * 0.55;
  orbitPos[i*3] = Math.cos(angle) * radius;
  orbitPos[i*3+1] = Math.sin(angle) * radius * 0.58 + Math.sin(radius * 0.7) * 1.1;
  orbitPos[i*3+2] = Math.cos(radius * 0.8 + angle) * 2.6 + (Math.random() - 0.5) * 1.6;

  // ikki tomonlama spiral (DNK)
  const hyy = (Math.random() - 0.5) * 22;
  const ang = hyy * 0.5 + (i % 2) * Math.PI;
  const rad = 3.4 + (Math.random() - 0.5) * 0.9;
  const f = (i % 6 === 0) ? Math.random() * 2 - 1 : 1;
  helixPos[i*3] = Math.cos(ang) * rad * f;
  helixPos[i*3+1] = hyy;
  helixPos[i*3+2] = Math.sin(ang) * rad * f;

  seed[i] = Math.random();
}
for (let i = HEART; i < COUNT; i++) {
  pos[i*3] = (Math.random() - 0.5) * 30;
  pos[i*3+1] = (Math.random() - 0.5) * 20;
  pos[i*3+2] = (Math.random() - 0.5) * 14;

  const rDust = 3.0 + Math.random() * 14.0;
  const aDust = Math.random() * Math.PI * 2;
  orbitPos[i*3] = Math.cos(aDust) * rDust;
  orbitPos[i*3+1] = Math.sin(aDust) * rDust * 0.65;
  orbitPos[i*3+2] = (Math.random() - 0.5) * 9.0;

  // atrofdagi yulduzlar sferasi
  const u = Math.random() * Math.PI * 2;
  const v = Math.acos(2 * Math.random() - 1);
  const r = 9 + Math.random() * 9;
  helixPos[i*3] = Math.sin(v) * Math.cos(u) * r;
  helixPos[i*3+1] = Math.sin(v) * Math.sin(u) * r;
  helixPos[i*3+2] = Math.cos(v) * r;

  seed[i] = Math.random();
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('aOrbit', new THREE.BufferAttribute(orbitPos, 3));
geo.setAttribute('aHelix', new THREE.BufferAttribute(helixPos, 3));
geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));

const uniforms = {
  uTime:  { value: 0 },
  uMorph: { value: 0 },
  uMorph2:{ value: 0 },
  uMouse: { value: new THREE.Vector3(99, 99, 0) },
  uPulse: { value: 1 },
  uPx:    { value: renderer.getPixelRatio() },
  uA:     { value: new THREE.Color(0xff5c8a) },
  uB:     { value: new THREE.Color(0xf0c59b) },
  uC:     { value: new THREE.Color(0xff9ebb) }
};

const material = new THREE.ShaderMaterial({
  uniforms: uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uMorph, uMorph2, uPulse, uPx;
    uniform vec3 uMouse;
    attribute vec3 aOrbit;
    attribute vec3 aHelix;
    attribute float aSeed;
    varying float vMix;
    varying float vMorph;
    void main() {
      vec3 p = mix(mix(position, aOrbit, uMorph), aHelix, uMorph2);
      float wave = sin(uTime * 1.15 + length(p.xy) * 0.65 + aSeed * 6.28);
      p.x += sin(uTime * 0.55 + p.y * 1.4 + aSeed * 6.28) * mix(0.12, 0.28, uMorph);
      p.y += cos(uTime * 0.45 + p.x * 1.4 + aSeed * 6.28) * mix(0.12, 0.28, uMorph);
      p.z += (sin(uTime * 0.7 + aSeed * 20.0) * 0.22) + wave * 0.45 * uMorph;
      vec2 d = p.xy - uMouse.xy;
      float dist = length(d);
      float radiusInfl = mix(2.4, 4.2, uMorph);
      float f = smoothstep(radiusInfl, 0.0, dist);
      vec2 dir = normalize(d + 0.0001);
      vec2 perp = vec2(-dir.y, dir.x);
      p.xy += dir * f * mix(1.5, -1.1, uMorph);
      p.xy += perp * f * 1.35 * uMorph;
      p.z  += f * mix(1.5, 2.6, uMorph);
      float ringR = uPulse * 13.0;
      float ring = exp(-pow(dist - ringR, 2.0) * 0.65) * (1.0 - uPulse);
      p.xy += dir * ring * 2.0;
      p.z  += ring * 2.8;
      vMix = clamp(f + ring + abs(wave) * 0.25 * uMorph, 0.0, 1.0);
      vMorph = uMorph;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (2.0 + aSeed * 3.2 + vMix * 6.2) * uPx * (12.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform vec3 uA, uB, uC;
    varying float vMix;
    varying float vMorph;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.0, d);
      vec3 baseCol = mix(uA, mix(uC, uB, 0.55), vMorph);
      vec3 finalCol = mix(baseCol, uB, vMix);
      gl_FragColor = vec4(finalCol, a * 0.92);
    }`
});
const points = new THREE.Points(geo, material);
scene.add(points);

/* ===== 4. Kursor va magnit ===== */
const mouse = { x: 0, y: 0 };
const smooth = { x: 0, y: 0 };
const cur = { x: innerWidth / 2, y: innerHeight / 2 };
const ringCur = { x: cur.x, y: cur.y };
let pulseStart = -10, isVideoPlaying = false;
let targetMorph = 0, targetMorph2 = 0, bgHidden = false;
const palA = new THREE.Color(0xff5c8a), palB = new THREE.Color(0xf0c59b), palC = new THREE.Color(0xff9ebb);

const trCanvas = document.getElementById('trail');
const tc = trCanvas.getContext('2d');
const stars = [];

letterVideo.addEventListener('play', function () { isVideoPlaying = true; tc.clearRect(0, 0, innerWidth, innerHeight); stars.length = 0; });
letterVideo.addEventListener('pause', function () { isVideoPlaying = false; });
letterVideo.addEventListener('ended', function () { isVideoPlaying = false; });

window.addEventListener('pointermove', function (e) {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -((e.clientY / innerHeight) * 2 - 1);
  cur.x = e.clientX; cur.y = e.clientY;
});
window.addEventListener('pointerdown', function () { pulseStart = clock.getElapsedTime(); });

const dot = document.getElementById('dot');
const ring = document.getElementById('ring');
document.querySelectorAll('button').forEach(function (b) {
  b.addEventListener('pointerenter', function () { ring.classList.add('big'); });
  b.addEventListener('pointerleave', function () { ring.classList.remove('big'); });
});

const envelope = document.getElementById('envelope');
const magnet = { x: 0, y: 0, tx: 0, ty: 0 };
window.addEventListener('pointermove', function (e) {
  const r = envelope.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2);
  const dy = e.clientY - (r.top + r.height / 2);
  const near = Math.hypot(dx, dy) < 260;
  magnet.tx = near ? dx * 0.12 : 0;
  magnet.ty = near ? dy * 0.12 : 0;
});

/* ===== 5. Asosiy animatsiya sikli ===== */
const clock = new THREE.Clock();
function damp(k, dt) { return 1 - Math.exp(-k * dt); }
let lastNow = performance.now();
const dotPos = { x: cur.x, y: cur.y };
const vel = { x: 0, y: 0 };

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastNow) / 1000, 0.05);
  lastNow = now;
  const t = clock.getElapsedTime();

  uniforms.uMorph.value += (targetMorph - uniforms.uMorph.value) * damp(2.2, dt);
  const m = uniforms.uMorph.value;
  uniforms.uMorph2.value += (targetMorph2 - uniforms.uMorph2.value) * damp(1.6, dt);
  const m2 = uniforms.uMorph2.value;
  const kc = damp(1.8, dt);
  uniforms.uA.value.lerp(palA, kc);
  uniforms.uB.value.lerp(palB, kc);
  uniforms.uC.value.lerp(palC, kc);

  smooth.x += (mouse.x - smooth.x) * damp(4.2, dt);
  smooth.y += (mouse.y - smooth.y) * damp(4.2, dt);
  const halfH = Math.tan((camera.fov * Math.PI) / 360) * camera.position.z;
  uniforms.uMouse.value.set(smooth.x * halfH * camera.aspect, smooth.y * halfH, 0);
  uniforms.uTime.value = t;
  uniforms.uPulse.value = Math.min((t - pulseStart) / 1.6, 1);

  points.rotation.z = (t * 0.08 + smooth.x * 0.35) * m * (1 - m2) + 0.18 * m2;
  points.rotation.y = smooth.x * (0.35 + 0.45 * m) + Math.sin(t * 0.35) * 0.18 + t * 0.25 * m2;
  points.rotation.x = -smooth.y * (0.2 + 0.45 * m) + Math.cos(t * 0.25) * 0.08 * m;

  camera.position.x = smooth.x * (0.8 + 1.4 * m);
  camera.position.y = smooth.y * (0.5 + 1.1 * m);
  camera.position.z = 12 - m * 1.4 + Math.sin(t * 0.5) * 0.35 * m + m2 * 3.5;
  camera.lookAt(0, 0, 0);

  const px = dotPos.x, py = dotPos.y;
  dotPos.x += (cur.x - dotPos.x) * damp(30, dt);
  dotPos.y += (cur.y - dotPos.y) * damp(30, dt);
  const kv = damp(12, dt);
  vel.x += ((dotPos.x - px) / Math.max(dt, 0.001) - vel.x) * kv;
  vel.y += ((dotPos.y - py) / Math.max(dt, 0.001) - vel.y) * kv;
  ringCur.x += (dotPos.x - ringCur.x) * damp(8, dt);
  ringCur.y += (dotPos.y - ringCur.y) * damp(8, dt);

  const stretch = 1 + Math.min(Math.hypot(vel.x, vel.y) / 4000, 0.3);
  dot.style.transform = 'translate3d(' + dotPos.x + 'px,' + dotPos.y + 'px,0)';
  ring.style.transform = 'translate3d(' + ringCur.x + 'px,' + ringCur.y + 'px,0) scale(' + stretch + ')';

  magnet.x += (magnet.tx - magnet.x) * damp(10, dt);
  magnet.y += (magnet.ty - magnet.y) * damp(10, dt);
  envelope.style.setProperty('--mx', magnet.x + 'px');
  envelope.style.setProperty('--my', magnet.y + 'px');

  if (!bgHidden) renderer.render(scene, camera);
}
animate();

/* ===== 7. Yulduzchalar izi ===== */
function trResize() {
  const r = Math.min(devicePixelRatio, 2);
  trCanvas.width = innerWidth * r;
  trCanvas.height = innerHeight * r;
  tc.setTransform(r, 0, 0, r, 0, 0);

const trailPrev = { x: dotPos.x, y: dotPos.y };
function rand(a, b) { return a + Math.random() * (b - a); }

function spawnStar(x, y, vx, vy) {
  if (stars.length > 300 || isVideoPlaying) return;
  stars.push({ x: x + rand(-5, 5), y: y + rand(-5, 5), vx: vx + rand(-0.4, 0.4), vy: vy + rand(-0.7, 0.1),
    size: rand(3, 9), rot: rand(0, Math.PI), spin: rand(-0.04, 0.04), phase: rand(0, 6.28), life: 1, decay: rand(0.008, 0.02) });
}
window.addEventListener('pointerdown', function (e) {
  if (isVideoPlaying) return;
  for (let i = 0; i < 22; i++) {
    const a = (i / 22) * Math.PI * 2, sp = rand(1.5, 4);
    spawnStar(e.clientX, e.clientY, Math.cos(a) * sp, Math.sin(a) * sp);
  }
});
function drawStar(x, y, r, rot) {
  tc.beginPath();
  for (let k = 0; k < 8; k++) {
    const a = rot + (k * Math.PI) / 4;
    const rr = k % 2 === 0 ? r : r * 0.28;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (k === 0) tc.moveTo(px, py); else tc.lineTo(px, py);
  }
  tc.closePath();
  tc.fill();
}
function trLoop(time) {
  requestAnimationFrame(trLoop);
  if (isVideoPlaying) return;
  const t = time / 1000;
  const dx = dotPos.x - trailPrev.x, dy = dotPos.y - trailPrev.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 9) {
    const steps = Math.min(8, Math.floor(dist / 9));
    for (let i = 1; i <= steps; i++) {
      const f = i / steps;
      spawnStar(trailPrev.x + dx * f, trailPrev.y + dy * f, vel.x * 0.0006, vel.y * 0.0006);
    }
    trailPrev.x = dotPos.x; trailPrev.y = dotPos.y;
  }
  tc.clearRect(0, 0, innerWidth, innerHeight);
  tc.globalCompositeOperation = 'lighter';
  tc.shadowColor = 'rgba(255,255,255,0.9)';
  tc.shadowBlur = 12;
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.x += s.vx + Math.sin(t * 3 + s.phase) * 0.3;
    s.y += s.vy; s.vy -= 0.003; s.vx *= 0.985;
    s.rot += s.spin; s.life -= s.decay;
    if (s.life <= 0) { stars.splice(i, 1); continue; }
    tc.globalAlpha = s.life * (0.65 + 0.35 * Math.sin(t * 10 + s.phase));
    tc.fillStyle = '#ffffff';
    drawStar(s.x, s.y, s.size * (0.4 + s.life * 0.6), s.rot);
  }
  tc.globalAlpha = 1;
}
requestAnimationFrame(trLoop);

const labels = ['Yo‘q', 'Aniqmi?', 'Rostdanmi?', 'Yana o‘yla', 'Mayli, yo‘q', 'Hali ham yo‘q?'];
const hints = ['', 'Ushlab ko‘r-chi 😏', 'Hmm, qo‘lga tushmayapti…', 'Yaxshilab o‘yla 🥺', 'Iltimos-ku…', 'Bu tugma buzilgan shekilli 🙈', 'Baribir “Ha” bosasan 😌'];
let tries = 0;

function dodge() {
  const r = no.getBoundingClientRect();
  if (!no.classList.contains('fly')) {
    no.style.left = r.left + 'px';
    no.style.top = r.top + 'px';
    no.classList.add('fly');
    no.getBoundingClientRect();
  }
  tries++;
  const m = 16;
  const maxX = innerWidth - r.width - m, maxY = innerHeight - r.height - m;
  let x, y, n = 0;
  do {
    x = m + Math.random() * (maxX - m);
    y = m + Math.random() * (maxY - m);
    n++;
  } while (n < 20 && Math.hypot(x - r.left, y - r.top) < 160);
  no.style.left = x + 'px';
  no.style.top = y + 'px';
  no.textContent = labels[Math.min(tries, labels.length - 1)];
  hint.textContent = hints[Math.min(tries, hints.length - 1)];
  yes.style.transform = 'scale(' + Math.min(1 + tries * 0.12, 2) + ')';
}

let lastDodge = 0;

  if (Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)) < 100) {
    lastDodge = now;
    dodge();

});

function splitWords(el) {
  const nodes = Array.from(el.childNodes);
  el.textContent = '';
  let i = 0;
  nodes.forEach(function (n) {
    if (n.nodeType === 3) {
      n.textContent.split(' ').filter(Boolean).forEach(function (part) {
        const s = document.createElement('span');
        s.className = 'w';
        s.textContent = part;
        s.style.setProperty('--i', i++);
        el.appendChild(s);
        el.appendChild(document.createTextNode(' '));
      });
    } else {
      el.appendChild(n);
    }
  });
}
function splitLetters(el) {
  const text = el.textContent;
  el.textContent = '';
  Array.from(text).forEach(function (ch, i) {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? '\u00a0' : ch;
    s.style.setProperty('--i', i);
    el.appendChild(s);
  });
}
document.querySelectorAll('.q').forEach(function (q) {
  if (!q.closest('.step[data-step="4"]')) splitWords(q);
});
splitLetters(document.getElementById('thxTitle'));
splitWords(document.getElementById('thxSub'));
document.querySelectorAll('.chips').forEach(function (g) {
  g.querySelectorAll('.chip').forEach(function (c, i) { c.style.setProperty('--i', i); });
});

function showThanks() {
  const bg = document.getElementById('thanksBg');
  for (let i = 0; i < 16; i++) {
    const b = document.createElement('span');
    b.className = 'bk';
    const size = rand(40, 140);
    b.style.width = b.style.height = size + 'px';
    b.style.left = rand(0, 95) + '%';
    b.style.top = rand(0, 95) + '%';
    b.style.setProperty('--dx', rand(-60, 60) + 'px');
    b.style.setProperty('--dy', rand(-90, 40) + 'px');
    b.style.animationDuration = rand(4, 9) + 's';
    b.style.animationDelay = (-rand(0, 6)) + 's';
    bg.appendChild(b);
  }
  const step = document.querySelector('.step.on');
  if (step) step.classList.add('leaving');
  bg.classList.add('show');
  setTimeout(function () {
    done.classList.add('hidden');
    document.getElementById('thanks').classList.remove('hidden');
  }, 1000);
}

document.querySelectorAll('.chips').forEach(function (group) {
  group.querySelectorAll('.chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      group.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('on'); });
      chip.classList.add('on');
      pick[group.dataset.key] = chip.dataset.v;
      const r = chip.getBoundingClientRect();
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2, sp = rand(1, 3.5);
        spawnStar(r.left + r.width / 2, r.top + r.height / 2, Math.cos(a) * sp, Math.sin(a) * sp);
      }
      if (group.dataset.next) setTimeout(function () { goStep(Number(group.dataset.next)); }, 600);
    });
  });
});

// "Qachon?": kun va soat tanlanmaguncha o'tkazmaydi
const whenNext = document.getElementById('whenNext');
const timeInput = document.getElementById('time');
const whenMsg = document.getElementById('whenMsg');
function whenReady() { return pick.when !== '' && timeInput.value !== ''; }
function refreshWhen() {
  whenNext.classList.toggle('locked', !whenReady());
  if (whenReady()) whenMsg.textContent = '';
}
timeInput.addEventListener('input', refreshWhen);
timeInput.addEventListener('change', refreshWhen);
document.querySelectorAll('.chips[data-key="when"] .chip').forEach(function (c) { c.addEventListener('click', refreshWhen); });
whenNext.addEventListener('click', function () {
  if (!whenReady()) {
    const noDay = pick.when === '';
    whenMsg.textContent = noDay ? 'Avval kunni tanla 🙂' : 'Soatni ham tanla ⏰';
    const target = noDay ? document.querySelector('.chips[data-key="when"]') : timeInput;
    target.classList.remove('shake');
    void target.offsetWidth;
    target.classList.add('shake');
    return;
  }
  goStep(3);
});

function buildText() {
  return 'Ha! 💖 Men uchrashuvga roziman.\n' +
         'Qayerda: ' + (pick.where || 'sen tanla') + '\n' +
         'Qachon: ' + (pick.when || 'o‘zing ayt') + ', soat ' + (timeInput.value || '—') + '\n' +
         'Gul: ' + (pick.flower || 'o‘zing bilasan');
}
function enterFinal() {
  setTimeout(function () { bgHidden = true; }, 1600);
  if (!document.getElementById('floaters')) {
    const box = document.createElement('div');
    box.id = 'floaters';
    const em = ['🌹', '🤎', '✨', '🌸', '☕'];
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      s.className = 'fl';
      s.textContent = em[i % em.length];
      s.style.left = rand(2, 96) + '%';
      s.style.fontSize = rand(16, 38) + 'px';
      s.style.animationDuration = rand(12, 26) + 's';
      s.style.animationDelay = (-rand(0, 20)) + 's';
      box.appendChild(s);
    }
    document.body.appendChild(box);
    void box.offsetWidth;
  }
  document.body.classList.add('final-mode');
}

function celebrate() {
  pulseStart = clock.getElapsedTime();
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(1.5, 6);
    spawnStar(innerWidth / 2, innerHeight / 2, Math.cos(a) * sp, Math.sin(a) * sp);
  }
}

document.getElementById('send').addEventListener('click', async function () {
  const btn = this;
  const msg = document.getElementById('sendMsg');
  btn.disabled = true;
  msg.textContent = 'Yuborilmoqda…';
  try {
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ access_key: WEB3FORMS_KEY, subject: 'Qomarii javob berdi 💖', from_name: 'Sevgi xati', message: buildText() })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message || 'xato');
    msg.textContent = 'Javobing yuborildi 💖';
    celebrate();
    setTimeout(showThanks, 1300);
  } catch (err) {
    const url = 'https://t.me/' + TELEGRAM + '?text=' + encodeURIComponent(buildText());
    msg.innerHTML = 'Yuborib bo‘lmadi. <a href="' + url + '" target="_blank" style="color:#ffb3c6">Telegram orqali yubor 💌</a>';
    btn.disabled = false;
  }
});

</script>
